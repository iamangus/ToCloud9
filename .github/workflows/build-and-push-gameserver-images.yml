name: Build and Push Gameserver Image (AMD64)

on:
  push:
    branches:
      - master
    paths:
      - game-server/azerothcore/Dockerfile
      - game-server/libsidecar-cpp/**
      - api/proto/**
      - sql/**
      - chart/files/playerbots.conf
      - .github/workflows/build-and-push-gameserver-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AzerothCore gameserver image (AMD64)
        run: |
          docker buildx build --push --platform linux/amd64 --output=type=image \
            -t ghcr.io/${{ github.actor }}/gameserver-ac:${{ github.ref_name }} \
            -f game-server/azerothcore/Dockerfile .
      - name: Build and push AzerothCore dbimport image (AMD64)
        run: |
          docker buildx build --push --platform linux/amd64 --output=type=image \
            -t ghcr.io/${{ github.actor }}/dbimport-ac:${{ github.ref_name }} \
            -f game-server/azerothcore/Dockerfile --target db-import .
