name: playerbot-agent-chart

on:
  pull_request:
    paths:
      - "chart/**"
      - ".github/workflows/playerbot-agent-chart.yml"
  push:
    branches:
      - master
      - "external-agent-controller"
    paths:
      - "chart/**"
      - ".github/workflows/playerbot-agent-chart.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: helm lint ./chart
      - run: >-
          helm template test ./chart
          --set playerbots.agentBridge.enabled=true
          --set agent_controller.enabled=true
          --set agent_controller.replicaCount=4
          --set agent_controller.modelEndpoint=https://llm.example/v1/chat/completions
           --set agent_controller.modelName=example-model
      - name: Verify paused social controller and non-overlapping rollouts
        run: |
          python3 -m pip install PyYAML==6.0.2
          helm template test ./chart \
            --set playerbots.agentBridge.enabled=true \
            --set agent_controller.enabled=true \
            --set agent_controller.paused=true \
            --set agent_controller.population.enabled=true \
            --set agent_controller.socialProgression.enabled=true \
            --set agent_controller.roadPreference.enabled=true \
            --set agent_controller.modelEndpoint=https://llm.example/v1/chat/completions \
            --set agent_controller.modelName=example-model > /tmp/paused.yaml
          python3 - <<'PY'
          import yaml
          with open('/tmp/paused.yaml') as stream:
              documents = [d for d in yaml.safe_load_all(stream) if d]
          controller = next(d for d in documents if d['kind'] == 'StatefulSet' and d['metadata']['name'].endswith('-agent-controller'))
          assert controller['spec']['replicas'] == 0
          pod = controller['spec']['template']['spec']
          env = {e['name']: e.get('value') for e in pod['containers'][0]['env']}
          assert env['AGENT_SHARD_COUNT'] == '1'
          assert env['AGENT_SOCIAL_PROGRESSION'] == 'true'
          assert env['AGENT_ROAD_PREFERENCE'] == 'true'
          assert pod['containers'][0]['volumeMounts'][0]['readOnly'] is True
          for suffix in ('-gameserver-ac', '-charserver'):
              deployment = next(d for d in documents if d['kind'] == 'Deployment' and d['metadata']['name'].endswith(suffix))
              assert deployment['spec']['strategy']['type'] == 'Recreate'
          PY
