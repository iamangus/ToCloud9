# ToCloud9 playerbot module settings. Defaults for all other module options are
# supplied by mod-playerbots and may be overridden here.
AiPlayerbot.Enabled = {{ if .Values.playerbots.enabled }}1{{ else }}0{{ end }}
AiPlayerbot.AgentBridge.Enabled = {{ if .Values.playerbots.agentBridge.enabled }}1{{ else }}0{{ end }}
AiPlayerbot.AgentBridge.BotGuid = {{ .Values.playerbots.agentBridge.botGuid }}
AiPlayerbot.AgentBridge.SubjectPrefix = {{ .Values.agent_controller.subjectPrefix | quote }}
